<mat-table [dataSource]="courses" class="mat-elevation-z8">
    <ng-container matColumnDef="title">
        <mat-header-cell *matHeaderCellDef> Titre</mat-header-cell>
        <mat-cell *matCellDef="let course"> {{ course.title }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef> Date</mat-header-cell>
        <mat-cell *matCellDef="let course"> {{ course.date | date:'short' }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef> Actions</mat-header-cell>
        <mat-cell *matCellDef="let course">
            <button (click)="deleteCourse.emit(course.id)" color="warn" mat-button>
                <mat-icon>delete</mat-icon>
                Supprimer
            </button>
        </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="['title', 'date', 'actions']" mat-header-row></mat-header-row>
    <mat-row *matRowDef="let row; columns: ['title', 'date', 'actions']" mat-row></mat-row>
</mat-table>

<!-- Affichage si aucune réservation -->
<div *ngIf="courses.length === 0" class="empty-state">
    Aucune réservation enregistrée.
</div>
